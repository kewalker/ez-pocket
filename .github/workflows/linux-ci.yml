name: Linux GTK4 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build experimental Linux app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install GTK4 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev gobject-introspection libgirepository1.0-dev gir1.2-gtk-4.0 pkg-config xvfb xauth

      - name: Build Linux app
        run: bash scripts/build-linux.sh

      - name: Check Linux startup
        run: bash scripts/test-linux-startup.sh dotnet Linux/bin/Debug/net10.0/EzPocket.Linux.dll
