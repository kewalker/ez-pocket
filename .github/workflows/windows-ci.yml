name: Windows CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET MAUI Windows workload
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Restore dependencies
        run: dotnet restore EzPocket.sln -p:TargetFramework=net9.0-windows10.0.19041.0

      - name: Verify version tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$project = Get-Content EzPocket.csproj
          $displayVersion = (Select-Xml -Xml $project -XPath '//ApplicationDisplayVersion').Node.InnerText
          if ("v$displayVersion" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match ApplicationDisplayVersion $displayVersion. Update the app version before tagging a release."
          }

      - name: Build Windows app and tests
        run: dotnet build EzPocket.sln -f net9.0-windows10.0.19041.0 --no-restore

      - name: Run tests
        run: dotnet test Tests/EzPocket.Tests.csproj -f net9.0-windows10.0.19041.0 --no-build --no-restore

  package-windows:
    name: Package unsigned Windows MSIX
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/NuGet.config', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET MAUI Windows workload
        run: dotnet workload install maui-windows --skip-manifest-update

      - name: Restore dependencies
        run: dotnet restore EzPocket.sln -p:TargetFramework=net9.0-windows10.0.19041.0 -r win-x64 -p:PublishReadyToRun=true

      - name: Create unsigned MSIX
        run: >
          dotnet publish EzPocket.csproj
          -f net9.0-windows10.0.19041.0
          -c Release
          --no-restore
          -p:RuntimeIdentifierOverride=win-x64
          -p:AppxPackageSigningEnabled=false

      - name: Upload unsigned package for signing and tester validation
        uses: actions/upload-artifact@v4
        with:
          name: ez-pocket-${{ github.ref_name }}-win-x64-unsigned
          path: bin/Release/**/AppPackages/**/*.msix
          if-no-files-found: error
          retention-days: 14

      - name: Publish self-contained Windows preview
        run: >
          dotnet publish EzPocket.csproj
          -f net9.0-windows10.0.19041.0
          -c Release
          --no-restore
          --self-contained true
          -p:RuntimeIdentifierOverride=win-x64
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:PublishDir=${{ github.workspace }}\artifacts\ez-pocket-win-x64\

      - name: Create Windows preview ZIP
        shell: pwsh
        run: >
          Compress-Archive
          -Path artifacts\ez-pocket-win-x64\*
          -DestinationPath artifacts\ez-pocket-${{ github.ref_name }}-win-x64.zip
          -CompressionLevel Optimal

      - name: Upload unsigned Windows preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ez-pocket-${{ github.ref_name }}-win-x64-unsigned-zip
          path: artifacts/ez-pocket-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish Windows technical-preview prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $previewZip = "artifacts/ez-pocket-$tag-win-x64.zip"
          @"
          ## Windows Technical Preview

          This prerelease contains an unsigned Windows preview ZIP for tester validation. Windows may show a SmartScreen warning or organization policy may block it.

          Use only with a backed-up Pocket SD card. Review changes before writing, safely eject the card afterward, and report issues with the included diagnostics where possible.

          This is an independent project and is not affiliated with, endorsed by, or sponsored by Analogue.
          "@ | Set-Content release-notes.md

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $previewZip --clobber
          }
          else {
            gh release create $tag $previewZip --title "$tag — Windows Technical Preview" --prerelease --notes-file release-notes.md
          }
